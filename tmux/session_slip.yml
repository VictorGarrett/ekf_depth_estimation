# do not modify these
root: ./
name: simulation
socket_name: mrs

startup_window: gazebo

windows:
  - gazebo:
      layout: tiled
      panes:
        - |
          export GZ_SIM_RESOURCE_PATH=$GZ_SIM_RESOURCE_PATH:$(pwd)/../:$(pwd)/../models
          
          ros2 launch tracker_control ground_slip.launch.py
        - |
            history -s "ros2 topic pub -1 /setpoint_position std_msgs/msg/Float32 \"{data: 2.0}\""

  - node:
      layout: tiled
      panes:
        - |
            while ! ros2 topic list | grep -q "/clock"; do
              echo "Waiting for Gazebo bridge to publish /clock..."
              sleep 0.5
            done
            echo "Gazebo is running!"
            sleep 5
            ros2 run tracker_control image_analyzer_ekf_slip_vel_absdepth_dyn.py
        - |
            history -s "ros2 topic pub -1 /setpoint_position std_msgs/msg/Float32 \"{data: 2.0}\""       
            
  - camera_image:
      layout: tiled
      panes:
        - ros2 run rqt_image_view rqt_image_view

  - plotjuggler:
      layout: tiled
      panes:
        - ros2 run plotjuggler plotjuggler